<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENEP-BERR — Paramètres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fond : bulles flottantes façon "aero" -->
  <div class="aqua-scene" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <span class="bubble" style="--x:8%;  --size:34px; --dur:14s; --delay:0s;"></span>
    <span class="bubble" style="--x:18%; --size:14px; --dur:9s;  --delay:1.2s;"></span>
    <span class="bubble" style="--x:27%; --size:22px; --dur:12s; --delay:3s;"></span>
    <span class="bubble" style="--x:41%; --size:10px; --dur:8s;  --delay:0.5s;"></span>
    <span class="bubble" style="--x:58%; --size:28px; --dur:15s; --delay:2.2s;"></span>
    <span class="bubble" style="--x:69%; --size:16px; --dur:10s; --delay:4.5s;"></span>
    <span class="bubble" style="--x:79%; --size:40px; --dur:17s; --delay:1.8s;"></span>
    <span class="bubble" style="--x:88%; --size:12px; --dur:9.5s; --delay:3.6s;"></span>
    <span class="bubble" style="--x:93%; --size:20px; --dur:13s; --delay:0.9s;"></span>
    <span class="bubble" style="--x:50%; --size:8px;  --dur:7s;  --delay:5.2s;"></span>
  </div>

  <!-- Titre fixé en haut de page -->
  <header class="top-brand">
    <span class="drop-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="40" height="40">
        <defs>
          <linearGradient id="dropFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a8ffdd"/>
            <stop offset="55%" stop-color="#33e6a0"/>
            <stop offset="100%" stop-color="#0a7a52"/>
          </linearGradient>
        </defs>
        <path d="M24 3C24 3 9 21 9 31.5C9 40.06 15.94 46 24 46C32.06 46 39 40.06 39 31.5C39 21 24 3 24 3Z" fill="url(#dropFill)"/>
        <ellipse cx="18.5" cy="24" rx="4.5" ry="7" fill="#ffffff" opacity="0.55"/>
      </svg>
    </span>
    <div class="brand-text">
      <h1>ENEP-BERR</h1>
      <p class="tagline">Limiteur de Shorts &amp; Reels</p>
    </div>
  </header>

  <!-- Zone centrale : le panneau de réglages -->
  <div class="stage">
    <main class="card options-card" role="main">

      <div class="columns">

        <section class="platform-col">
          <h2 class="col-title">
            <span class="col-icon col-icon--yt" aria-hidden="true">▶</span>
            YouTube
          </h2>

          <div class="field">
            <label for="maxShorts">
              Shorts max par jour
              <span class="hint">Au-delà, la lecture te renvoie à l'accueil YouTube</span>
            </label>
            <div class="stepper">
              <button type="button" class="step-btn" id="decShortsBtn" aria-label="Diminuer">−</button>
              <input type="number" id="maxShorts" min="1" max="100" inputmode="numeric">
              <button type="button" class="step-btn" id="incShortsBtn" aria-label="Augmenter">+</button>
            </div>
          </div>

          <div class="field toggle-field">
            <div class="toggle-row">
              <label for="blockShortsToggle">
                Bloquer les Shorts entièrement
                <span class="hint">Le nombre max ci-dessus est ignoré</span>
              </label>
              <button type="button" id="blockShortsToggle" class="aero-switch" role="switch" aria-checked="false">
                <span class="knob"></span>
              </button>
            </div>
          </div>

          <div class="field counters-field">
            <label>
              Compteur du jour
              <span class="hint">Pratique pour tester sans attendre le lendemain</span>
            </label>
            <div class="counter-row">
              <div class="counter-info">
                <span class="counter-label">Shorts vus</span>
                <span class="counter-value" id="shortsCounterValue">– / –</span>
              </div>
              <button type="button" class="reset-btn" id="resetShortsBtn">Réinitialiser</button>
            </div>
          </div>

          <a href="notes.html" target="_blank" class="notes-link">Voir mes notes →</a>
        </section>

        <div class="col-divider" aria-hidden="true"></div>

        <section class="platform-col">
          <h2 class="col-title">
            <span class="col-icon col-icon--ig" aria-hidden="true">◆</span>
            Instagram
          </h2>

          <div class="field">
            <label for="maxReels">
              Reels max par jour
              <span class="hint">Au-delà, la lecture te renvoie à l'accueil Instagram</span>
            </label>
            <div class="stepper">
              <button type="button" class="step-btn" id="decReelsBtn" aria-label="Diminuer">−</button>
              <input type="number" id="maxReels" min="1" max="100" inputmode="numeric">
              <button type="button" class="step-btn" id="incReelsBtn" aria-label="Augmenter">+</button>
            </div>
          </div>

          <div class="field counters-field">
            <label>
              Compteur du jour
              <span class="hint">Pratique pour tester sans attendre le lendemain</span>
            </label>
            <div class="counter-row">
              <div class="counter-info">
                <span class="counter-label">Reels vus</span>
                <span class="counter-value" id="reelsCounterValue">– / –</span>
              </div>
              <button type="button" class="reset-btn" id="resetReelsBtn">Réinitialiser</button>
            </div>
          </div>
        </section>

      </div>

      <button type="button" id="saveBtn" class="save-btn">
        <span>Enregistrer</span>
      </button>

      <p id="status" class="status" role="status" aria-live="polite"></p>

    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
